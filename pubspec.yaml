name: easytvethub
description: "EasyTVET Hub — Kenyan TVET past papers, CDACC & KNEC curriculum resources, and offline revision companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend (Shared Supabase - Public Read Only)
  supabase_flutter: ^2.8.0

  # State Management & Caching
  flutter_riverpod: ^2.6.1

  # Declarative Routing & Deep Linking
  go_router: ^14.6.0

  # Networking, Local Storage & Offline PDFs
  dio: ^5.7.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  pdfrx: ^1.0.95
  url_launcher: ^6.3.1
  share_plus: ^10.1.2

  # UI & Markdown Parity
  lucide_icons_flutter: ^4.0.0
  flutter_markdown: ^0.7.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
